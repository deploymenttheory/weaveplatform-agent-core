version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/deploymenttheory/weaveplatform-agent/sdk/gen/go
plugins:
  - local: protoc-gen-go
    out: sdk/gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: sdk/gen/go
    opt: paths=source_relative
