name: module-release (sysinfo)

# sysinfo is the platform's own module and the template, so it releases from
# here — through the same reusable pipeline every product repository calls.
# The tag shape modules/<id>/vX.Y.Z is release-please's component tag; the
# reusable workflow strips everything up to the last "/v".
on:
  push:
    tags:
      - 'modules/sysinfo/v*'
  # Re-publish an existing tag after a pipeline fix without cutting a release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. modules/sysinfo/v0.3.0
        required: true

jobs:
  publish:
    uses: ./.github/workflows/module-release.yml
    with:
      module-dir: modules/sysinfo
      ref: ${{ inputs.tag || '' }}
    secrets: inherit
