on:
  push:
    branches:
    - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    name: '🔖 Release Please'
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    # Manifest-driven, two components. Core (".") keeps bare vX.Y.Z tags —
    # goreleaser and the cosign identity depend on that shape. The sdk is a
    # nested Go module tagged sdk/vX.Y.Z so modules can pin it independently
    # of core's release cadence; that tag never triggers goreleaser because
    # its "v*" filter cannot match a "/" (GitHub globs stop at the separator).
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        token: ${{ secrets.RELEASE_PLEASE_PAT }}
