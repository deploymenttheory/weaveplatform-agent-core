name: go-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # One lane per Go module in this repo; `go test ./...` at the root does
        # not descend into nested modules.
        module: [".", "sdk"]
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Test
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go test ./...

      # GOWORK=off so a local workspace can never mask a stale pin. The root
      # module builds the sdk through its `replace => ./sdk`; the sdk lane
      # builds against its own recorded requirements, which is what a module
      # author gets.
      - name: Build (GOWORK=off)
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go build ./...

      # The root module builds sdk/ through a replace, so a dependency bump
      # inside sdk/ (dependabot only edits sdk/go.mod) leaves the root go.sum
      # without the new hashes. Builds with -mod=readonly then fail with
      # "missing go.sum entry" — which is how the v0.3.0 release lost its
      # artifacts. Fail the PR instead.
      - name: go.mod/go.sum are tidy
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy in ${{ matrix.module }} — run 'go mod tidy' here (and at the root after any sdk/ bump)"
            exit 1
          }

  # Go's internal/ rule is path-based: sdk/ sits inside the tree rooted at
  # weaveplatform-agent/, so the compiler would let it import
  # weaveplatform-agent/internal/... . Before the sdk moved in here that was a
  # compile error across a repo boundary; this job is what replaces it.
  # Modules build against the sdk alone and must never depend on core.
  boundary:
    name: sdk never imports core
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go.mod
      - name: Check
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          if go list -deps ./... | grep -E '^github.com/deploymenttheory/weaveplatform-agent/(internal|cmd)(/|$)'; then
            echo "::error::sdk/ imports core packages — the module SDK must not depend on core"
            exit 1
          fi
          echo "sdk depends on nothing under weaveplatform-agent/internal or /cmd"

  race:
    name: race ${{ matrix.module }} (${{ matrix.os }})
    # Race detector needs cgo; run it where a C toolchain is reliable.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "sdk"]
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Test (-race)
        env:
          CGO_ENABLED: "1"
          GOWORK: "off"
        run: go test -race ./...
