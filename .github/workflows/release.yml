# Builds and attaches the release binaries when release-please tags a
# release.
#
# release-please owns the version, the changelog and the GitHub release
# itself; this only builds the artifacts and appends them. A failure here
# leaves the release intact rather than half-made, and the run can be
# repeated without re-tagging.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: 📦 Build and sign release archives
    # Belt and braces for the tag filter above: component tags (sdk/v1.2.3,
    # modules/<id>/v1.2.3) are not core releases and must never build one.
    if: ${{ !contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    permissions:
      # Attaching the archives to the release.
      contents: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate naming this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version from the tag, which needs the
          # tags and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@v3

      # Release builds must be production builds: the `dev` build tag turns
      # on the manifest-root-pub override and insecure enrolment, which must
      # never ship. Fail the release if it leaks into the build config.
      - name: Guard against dev build tag
        shell: bash
        run: |
          if grep -rEn '[-]tags[ =]+([^ ]*,)?dev\b' .goreleaser.yaml; then
            echo "::error::a 'dev' build tag is present in .goreleaser.yaml — release builds must be production"
            exit 1
          fi
          echo "no dev build tag in the release build config"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
