name: fuzz

on:
  schedule:
    # Nightly at 03:17 UTC — a long soak beyond the seed corpus PRs run.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: handshake, pkg: ./handshake/, func: FuzzParse }
          - { name: manifest, pkg: ./manifest/, func: FuzzManifest }
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go.mod

      - name: Fuzz ${{ matrix.target.func }}
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.func }}$' -fuzztime 5m

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target.name }}-corpus
          path: sdk/${{ matrix.target.name }}/testdata/fuzz
