# Release packaging for the agent: weaveboot, weave-agent (core) and
# weavectl travel together — they install as one unit under the immutable
# footprint (pkg/README.md), so each platform gets one archive with all
# three binaries.
#
# Zone A throughout: pure Go, CGO_ENABLED=0, every target cross-compiled
# from one runner. This signs the release archives (cosign, keyless);
# platform code signing of the binaries themselves (codesign/notarize,
# Authenticode) is the packaging pipeline's job, not this one's.
version: 2

project_name: weaveplatform-agent

before:
  hooks:
    - go mod download

builds:
  - id: weave-agent
    main: ./cmd/weave-agent
    binary: weave-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # internal/version owns the version; everything asks it, so there is
      # nothing to keep in sync.
      - -s -w
      - -X github.com/deploymenttheory/weaveplatform-agent/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: weaveboot
    main: ./cmd/weaveboot
    binary: weaveboot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/deploymenttheory/weaveplatform-agent/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: weavectl
    main: ./cmd/weavectl
    binary: weavectl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/deploymenttheory/weaveplatform-agent/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: weaveplatform-agent
    ids: [weave-agent, weaveboot, weavectl]
    # weaveplatform-agent_0.1.0_darwin_arm64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - spec.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Sign the checksum file rather than each archive: verifying the checksums
# verifies every archive through it. Keyless signing binds the signature to
# this workflow's identity — no private key to hold or rotate. (Distinct
# from the channel-manifest Ed25519 chain, which core verifies at runtime.)
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # release-please owns the changelog and release notes.
  disable: true

release:
  # release-please creates the release when its PR merges; this run
  # attaches the artifacts to it.
  mode: append
  footer: |
    ---

    Binaries are pure Go (Zone A) and require no runtime dependencies. Each
    archive carries `weaveboot`, `weave-agent` and `weavectl` for one platform.

    Verify a download against the signed checksum file:

    ```console
    cosign verify-blob \
      --bundle weaveplatform-agent_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/deploymenttheory/weaveplatform-agent/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      weaveplatform-agent_{{ .Version }}_checksums.txt

    shasum -a 256 -c weaveplatform-agent_{{ .Version }}_checksums.txt --ignore-missing
    ```
